site_name: Minecraft Docs
site_description: Client-side and server-side Minecraft documentation

theme:
  name: mkdocs

nav:
  - Home: index.md
  - Client:
      - Overview: client/index.md
      - Setup: client/setup.md
      - Mods: client/mods.md
      - Resource Packs: client/resource-packs.md
  - Server:
      - Overview: server/index.md
      - Setup: server/setup.md
      - Configuration: server/configuration.md
      - Plugins: server/plugins.md
      - Performance: server/performance.md
  - Reference:
      - Overview: reference/index.md
      - Commands: reference/commands.md
      - Versions: reference/versions.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
